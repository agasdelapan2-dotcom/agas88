<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal Kapal Harian KLM AGAS88</title>

    <!-- Favicon & App Icon untuk Google Search & Browser -->
  <link rel="icon" href="https://www.agas88.com/logo-pt-agas88.png" type="image/png" sizes="48x48">
  <link rel="icon" href="https://www.agas88.com/logo-pt-agas88.png" type="image/png" sizes="192x192">
  <link rel="shortcut icon" href="https://www.agas88.com/logo-pt-agas88.png" type="image/x-icon">
  <link rel="apple-touch-icon" href="https://www.agas88.com/logo-pt-agas88.png">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: {
                            800: '#0B192C',
                            900: '#1E3E62',
                        },
                        ocean: '#00ADB5',
                    }
                }
            }
        }
    </script>
    <!-- PapaParse untuk membaca CSV Google Sheets -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-100 font-sans p-4 md:p-10">

    <div class="max-w-6xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">
        <!-- Header Tabel -->
        <div class="bg-navy-800 text-white p-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <div class="flex items-center space-x-2">
                    <i data-lucide="anchor" class="text-ocean w-7 h-7"></i>
                    <h1 class="text-2xl font-bold tracking-wide">PT. AGAS88</h1>
                </div>
                <p class="text-slate-300 text-sm mt-1">Jadwal Keberangkatan & Kedatangan Kapal KLM Hari Ini</p>
            </div>
            
            <div class="flex items-center gap-3">
                <span id="last-updated" class="text-xs text-slate-300">Memuat data...</span>
                <button onclick="muatJadwalKapal()" class="bg-ocean hover:bg-teal-500 text-white px-3 py-1.5 rounded-lg text-sm font-semibold transition flex items-center gap-1 shadow">
                    <i data-lucide="refresh-cw" class="w-4 h-4"></i> Refresh Data
                </button>
            </div>
        </div>

        <!-- Filter / Pencarian -->
        <div class="p-4 bg-slate-50 border-b border-slate-200 flex flex-col sm:flex-row gap-4 justify-between items-center">
            <div class="relative w-full sm:w-80">
                <input type="text" id="search-input" onkeyup="filterTabel()" placeholder="Cari Nama Kapal / Pelabuhan..." 
                       class="w-full pl-10 pr-4 py-2 border rounded-xl focus:outline-none focus:ring-2 focus:ring-ocean text-sm">
                <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-3"></i>
            </div>
            <span class="text-xs text-slate-500 font-medium">*Terhubung langsung dengan Google Sheets resmi PT. AGAS88</span>
        </div>

        <!-- Container Tabel -->
        <div class="overflow-x-auto">
            <table class="w-full text-left text-sm" id="tabel-jadwal">
                <thead class="bg-slate-200 text-navy-800 uppercase font-bold text-xs tracking-wider">
                    <tr>
                        <th class="p-4">Nama Kapal</th>
                        <th class="p-4">Pelabuhan Asal</th>
                        <th class="p-4">Tujuan</th>
                        <th class="p-4">ETA / ETD</th>
                        <th class="p-4 text-center">Status</th>
                    </tr>
                </thead>
                <tbody id="jadwal-body" class="divide-y divide-slate-100 text-slate-700">
                    <tr>
                        <td colspan="5" class="text-center py-12 text-slate-400">
                            <i data-lucide="loader-2" class="w-8 h-8 animate-spin mx-auto mb-2 text-ocean"></i>
                            Sedang sinkronisasi data dari Google Sheets...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // URL GOOGLE SHEETS RESMI ANDA
        const GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSAfZnehsTlyCCwQ0iZjEleqEmgcxedIknGX1H9Vy6vi48LYAYHoZnz0XsOf1PRX-JYntG0WH3fj0oy/pub?gid=0&single=true&output=csv";

        let dataKapalLengkap = [];

        function cariNilai(row, kataKunciList) {
            const keys = Object.keys(row);
            for (let key of keys) {
                const cleanKey = key.replace(/[\[\]]/g, '').trim().toLowerCase();
                for (let k of kataKunciList) {
                    if (cleanKey === k.toLowerCase()) {
                        return row[key] ? row[key].trim() : '';
                    }
                }
            }
            return '';
        }

        async function muatJadwalKapal() {
            const bodyTabel = document.getElementById("jadwal-body");
            const timeStamp = document.getElementById("last-updated");

            Papa.parse(GOOGLE_SHEET_CSV_URL, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    dataKapalLengkap = results.data;
                    tampilkanTabel(dataKapalLengkap);
                    
                    const sekarang = new Date();
                    timeStamp.innerText = `Update: ${sekarang.toLocaleTimeString('id-ID')} WITA`;
                },
                error: function(err) {
                    console.error("Gagal membaca Google Sheets:", err);
                    bodyTabel.innerHTML = `
                        <tr>
                            <td colspan="5" class="text-center py-8 text-red-500 font-semibold">
                                Gagal mengambil data. Pastikan jaringan internet stabil.
                            </td>
                        </tr>`;
                }
            });
        }

        function tampilkanTabel(data) {
            const bodyTabel = document.getElementById("jadwal-body");
            bodyTabel.innerHTML = "";

            if (!data || data.length === 0) {
                bodyTabel.innerHTML = `
                    <tr>
                        <td colspan="5" class="text-center py-8 text-slate-400">
                            Tidak ada data jadwal kapal pada spreadsheet.
                        </td>
                    </tr>`;
                return;
            }

            let jumlahBarisValid = 0;

            data.forEach(item => {
                // Fleksibel mendeteksi kolom baik menggunakan [ ] maupun tanpa [ ]
                const namaKapal = cariNilai(item, ["nama kapal", "nama_kapal", "kapal"]);
                const asal = cariNilai(item, ["pelabuhan asal", "asal", "dari"]);
                const tujuan = cariNilai(item, ["tujuan", "ke", "pelabuhan tujuan"]);
                const eta = cariNilai(item, ["eta", "etd", "waktu", "eta / etd"]);
                const status = cariNilai(item, ["status", "keterangan"]);

                // Abaikan baris kosong
                if (!namaKapal && !asal && !tujuan) return;

                jumlahBarisValid++;

                let badgeClass = "bg-slate-100 text-slate-700 border border-slate-300";
                const statusLower = status.toLowerCase();
                
                if (statusLower.includes("sandar")) {
                    badgeClass = "bg-emerald-100 text-emerald-800 border border-emerald-300";
                } else if (statusLower.includes("berlayar")) {
                    badgeClass = "bg-blue-100 text-blue-800 border border-blue-300";
                } else if (statusLower.includes("persiapan") || statusLower.includes("labuh")) {
                    badgeClass = "bg-amber-100 text-amber-800 border border-amber-300";
                }

                const baris = `
                    <tr class="hover:bg-slate-50 transition">
                        <td class="p-4 font-bold text-navy-800 flex items-center gap-2">
                            <i data-lucide="ship" class="w-4 h-4 text-ocean"></i>
                            ${namaKapal || '-'}
                        </td>
                        <td class="p-4">${asal || '-'}</td>
                        <td class="p-4">${tujuan || '-'}</td>
                        <td class="p-4 font-semibold text-slate-600">${eta || '-'}</td>
                        <td class="p-4 text-center">
                            <span class="${badgeClass} px-3 py-1 rounded-full text-xs font-bold tracking-wide inline-block">
                                ${status || 'Menunggu'}
                            </span>
                        </td>
                    </tr>
                `;
                bodyTabel.innerHTML += baris;
            });

            if (jumlahBarisValid === 0) {
                bodyTabel.innerHTML = `
                    <tr>
                        <td colspan="5" class="text-center py-8 text-slate-400">
                            Format header Google Sheets tidak sesuai. Pastikan ada baris judul (Nama Kapal, Pelabuhan Asal, Tujuan, ETA, Status).
                        </td>
                    </tr>`;
            }

            lucide.createIcons();
        }

        function filterTabel() {
            const kataKunci = document.getElementById("search-input").value.toLowerCase();
            const hasilFilter = dataKapalLengkap.filter(item => {
                const nama = cariNilai(item, ["nama kapal", "nama_kapal", "kapal"]).toLowerCase();
                const asal = cariNilai(item, ["pelabuhan asal", "asal", "dari"]).toLowerCase();
                const tujuan = cariNilai(item, ["tujuan", "ke", "pelabuhan tujuan"]).toLowerCase();
                return nama.includes(kataKunci) || asal.includes(kataKunci) || tujuan.includes(kataKunci);
            });
            tampilkanTabel(hasilFilter);
        }

        document.addEventListener("DOMContentLoaded", () => {
            muatJadwalKapal();
            lucide.createIcons();
        });
    </script>
</body>
</html>
