    <title>PT. AGAS88 - Keberangkatan Kapal</title>
    <!-- Tailwind CSS for layout utilities -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for UI icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts for receipt/board typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Courier+Prime:wght@700&display=swap" rel="stylesheet">
    <!-- html2canvas for high-res PNG export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0284c7; /* Matching blue background */
        }
        .receipt-font {
            font-family: 'Courier Prime', monospace;
        }

        /* Clean custom styling for select elements */
        select.custom-select {
            appearance: none;
            -webkit-appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%20334155' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 0.5rem center;
            background-size: 1.25em;
        }
        
        /* Hide action buttons during window.print() */
        @media print {
            #controls, #instructions, .select-arrow {
                display: none !important;
            }
            body {
                background-color: transparent !important;
                padding: 0 !important;
            }
            #captureArea {
                box-shadow: none !important;
                border: none !important;
                max-width: 100% !important;
                width: 100% !important;
            }
            select.custom-select {
                background-image: none !important;
            }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-3 sm:p-6">

    <div class="w-full max-w-xl mx-auto flex flex-col items-center">

        <!-- Control Bar -->
        <div id="controls" class="w-full bg-white/95 backdrop-blur-md rounded-2xl p-4 mb-4 shadow-xl flex flex-wrap gap-3 justify-between items-center text-slate-800 border border-white/20">
            <div>
                <h1 class="font-bold text-base sm:text-lg text-blue-900 flex items-center gap-2">
                    <i class="fa-solid fa-ship text-blue-600"></i> Board Keberangkatan
                </h1>
                <p class="text-xs text-slate-500">Pilih nama kapal dari dropdown atau edit teks langsung.</p>
            </div>
            <div class="flex flex-wrap gap-2">
                <button onclick="resetData()" class="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs sm:text-sm font-semibold rounded-xl transition shadow-sm flex items-center">
                    <i class="fa-solid fa-rotate-right mr-1.5"></i> Reset
                </button>
                <button onclick="printCard()" class="px-3 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-xs sm:text-sm font-semibold rounded-xl transition shadow-md flex items-center">
                    <i class="fa-solid fa-print mr-1.5"></i> Cetak / PDF
                </button>
                <button onclick="downloadImage()" class="px-3 py-2 bg-blue-600 hover:bg-blue-700 text-white text-xs sm:text-sm font-semibold rounded-xl transition shadow-md flex items-center">
                    <i class="fa-solid fa-download mr-1.5"></i> Simpan PNG
                </button>
            </div>
        </div>

        <!-- MAIN BOARD CAPTURE CARD -->
        <div id="captureArea" class="w-full bg-[#0284c7] p-2 sm:p-4 rounded-2xl shadow-2xl flex flex-col overflow-hidden border-4 border-blue-500/50">
            
            <div class="bg-white rounded-xl overflow-hidden shadow-lg border border-slate-100">
                
                <!-- HEADER / KOP IMAGE -->
                <div class="w-full bg-white border-b-2 border-blue-600">
                    <img 
                        src="https://res.cloudinary.com/di8stbg60/image/upload/v1791794613/agasku_do1qo9.png" 
                        alt="PT. AGAS88 Header" 
                        class="header-image w-full h-auto object-contain block"
                        crossorigin="anonymous"
                    />
                </div>

                <!-- BOARD CONTENT SECTION -->
                <div class="p-5 sm:p-8 bg-white text-slate-900 flex flex-col space-y-4">
                    
                    <!-- TITLE: KEBERANGKATAN -->
                    <div class="border-b-2 border-slate-200 pb-2">
                        <div 
                            contenteditable="true" 
                            id="val-title" 
                            class="text-2xl sm:text-3xl font-black tracking-wider text-slate-900 uppercase focus:outline-none focus:bg-blue-50 rounded px-1 transition"
                        >
                            KEBERANGKATAN
                        </div>
                    </div>

                    <!-- INFORMATION GRID -->
                    <div class="grid grid-cols-1 gap-3.5 text-base sm:text-xl font-bold receipt-font text-slate-900">
                        
                        <!-- KLM DROPDOWN FIELD -->
                        <div class="flex items-center">
                            <span class="w-28 sm:w-36 text-slate-800 shrink-0">KLM</span>
                            <span class="mr-2 sm:mr-4 text-slate-800">:</span>
                            <div class="flex-1 relative">
                                <select 
                                    id="val-klm" 
                                    class="custom-select w-full uppercase bg-slate-50 hover:bg-blue-50 focus:bg-blue-50 focus:outline-none focus:ring-2 focus:ring-blue-500 rounded px-2 py-1 pr-7 transition border border-dashed border-slate-300 hover:border-blue-400 font-bold receipt-font text-slate-900 cursor-pointer"
                                >
                                    <option value="KLM.SUMBER RIZKY">KLM.SUMBER RIZKY</option>
                                    <option value="KLM.SUMBER RIZKY 02">KLM.SUMBER RIZKY 02</option>
                                    <option value="KLM.SUMBER REZKY A">KLM.SUMBER REZKY A</option>
                                    <option value="KLM.ADI RAHMATULLAH PUTRA">KLM.ADI RAHMATULLAH PUTRA</option>
                                    <option value="KLM.SUMBER REZKY B" selected>KLM.SUMBER REZKY B</option>
                                    <option value="KLM.QUDRAT ILAHI">KLM.QUDRAT ILAHI</option>
                                    <option value="KLM.FIRDAH JAYA 03">KLM.FIRDAH JAYA 03</option>
                                    <option value="KLM.SYUKRAN 3">KLM.SYUKRAN 3</option>
                                    <option value="KLM.SYUKRAN 03">KLM.SYUKRAN 03</option>
                                    <option value="KLM.BUNGA RIZKA">KLM.BUNGA RIZKA</option>
                                    <option value="KLM.SURYA UTAMA 77">KLM.SURYA UTAMA 77</option>
                                    <option value="KLM.MARHABAN 02">KLM.MARHABAN 02</option>
                                    <option value="KLM.BERKAT SABAR 05">KLM.BERKAT SABAR 05</option>
                                    <option value="KLM.BERKAH ILAHI 99">KLM.BERKAH ILAHI 99</option>
                                    <option value="KLM.SUMBER REZKY 88">KLM.SUMBER REZKY 88</option>
                                    <option value="KLM.ANUGERAH REZKY PUTRA">KLM.ANUGERAH REZKY PUTRA</option>
                                </select>
                            </div>
                        </div>

                        <!-- TUJUAN -->
                        <div class="flex items-center">
                            <span class="w-28 sm:w-36 text-slate-800 shrink-0">TUJUAN</span>
                            <span class="mr-2 sm:mr-4 text-slate-800">:</span>
                            <div 
                                contenteditable="true" 
                                id="val-tujuan" 
                                class="flex-1 uppercase bg-slate-50 hover:bg-blue-50 focus:bg-blue-50 focus:outline-none focus:ring-2 focus:ring-blue-500 rounded px-2 py-1 transition border border-dashed border-slate-200 hover:border-blue-400"
                            >
                                SAMARINDA
                            </div>
                        </div>

                        <!-- BRKT. TGL -->
                        <div class="flex items-center">
                            <span class="w-28 sm:w-36 text-slate-800 shrink-0">BRKT. TGL</span>
                            <span class="mr-2 sm:mr-4 text-slate-800">:</span>
                            <div 
                                contenteditable="true" 
                                id="val-tgl" 
                                class="flex-1 text-emerald-600 font-extrabold bg-slate-50 hover:bg-blue-50 focus:bg-blue-50 focus:outline-none focus:ring-2 focus:ring-blue-500 rounded px-2 py-1 transition border border-dashed border-slate-200 hover:border-blue-400"
                            >
                                12-10-2026
                            </div>
                        </div>

                        <!-- JAM -->
                        <div class="flex items-center">
                            <span class="w-28 sm:w-36 text-slate-800 shrink-0">JAM.</span>
                            <span class="mr-2 sm:mr-4 text-slate-800">:</span>
                            <div 
                                contenteditable="true" 
                                id="val-jam" 
                                class="flex-1 bg-slate-50 hover:bg-blue-50 focus:bg-blue-50 focus:outline-none focus:ring-2 focus:ring-blue-500 rounded px-2 py-1 transition border border-dashed border-slate-200 hover:border-blue-400"
                            >
                                22:30
                            </div>
                        </div>

                        <!-- CREW + TIMESTAMP -->
                        <div class="flex items-center justify-between pt-1">
                            <div class="flex items-center flex-1">
                                <span class="w-28 sm:w-36 text-slate-800 shrink-0">CREW</span>
                                <span class="mr-2 sm:mr-4 text-slate-800">:</span>
                                <div 
                                    contenteditable="true" 
                                    id="val-crew" 
                                    class="w-24 bg-slate-50 hover:bg-blue-50 focus:bg-blue-50 focus:outline-none focus:ring-2 focus:ring-blue-500 rounded px-2 py-1 transition border border-dashed border-slate-200 hover:border-blue-400"
                                >
                                    4
                                </div>
                            </div>

                            <!-- TIMESTAMP -->
                            <div 
                                contenteditable="true"
                                id="timestamp" 
                                class="text-sm font-sans font-normal text-slate-500 hover:text-slate-800 focus:outline-none focus:bg-blue-50 px-2 py-1 rounded"
                            >
                                16.27
                            </div>
                        </div>

                    </div>

                </div>

            </div>

        </div>

        <!-- User Help Tip -->
        <div id="instructions" class="mt-4 text-center text-white/90 text-xs sm:text-sm max-w-md">
            <p><i class="fa-solid fa-lightbulb text-yellow-300 mr-1"></i> Pilih nama kapal dari dropdown, atau klik teks lainnya untuk langsung mengubah datanya.</p>
        </div>

    </div>

    <script>
        // Reset all fields to default values
        function resetData() {
            document.getElementById('val-title').innerText = 'KEBERANGKATAN';
            document.getElementById('val-klm').value = 'KLM.SUMBER REZKY B';
            document.getElementById('val-tujuan').innerText = 'SAMARINDA';
            document.getElementById('val-tgl').innerText = '12-10-2026';
            document.getElementById('val-jam').innerText = '22:30';
            document.getElementById('val-crew').innerText = '4';
            document.getElementById('timestamp').innerText = '16.27';
        }

        // Trigger native browser print dialog
        function printCard() {
            window.print();
        }

        // Export card to PNG using html2canvas
        function downloadImage() {
            const captureArea = document.getElementById('captureArea');
            const controls = document.getElementById('controls');
            const instructions = document.getElementById('instructions');

            controls.style.visibility = 'hidden';
            instructions.style.visibility = 'hidden';

            html2canvas(captureArea, {
                scale: 3,
                useCORS: true,
                allowTaint: true,
                backgroundColor: null
            }).then(canvas => {
                controls.style.visibility = 'visible';
                instructions.style.visibility = 'visible';

                const link = document.createElement('a');
                link.download = 'Keberangkatan-PT-AGAS88.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            }).catch(err => {
                console.error('Download error:', err);
                controls.style.visibility = 'visible';
                instructions.style.visibility = 'visible';
            });
        }
    </script>

</body>
