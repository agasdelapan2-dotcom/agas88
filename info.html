<!-- Container Utama Aplikasi -->
<div id="agas88-scheduler">
  <style>
    #agas88-scheduler {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      padding: 10px;
      box-sizing: border-box;
    }
    #agas88-scheduler * {
      box-sizing: border-box;
    }
    #agas88-scheduler .card {
      background: #ffffff;
      width: 100%;
      max-width: 650px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      overflow: hidden;
      border-top: 8px solid #0056b3;
    }
    #agas88-scheduler .header {
      padding: 20px;
      text-align: center;
    }
    #agas88-scheduler .header h2 {
      margin: 0;
      color: #0056b3;
      font-size: 24px;
      font-weight: bold;
    }
    #agas88-scheduler .realtime-clock {
      font-size: 14px;
      font-weight: 600;
      color: #0056b3;
      margin-top: 6px;
      background: #eef5ff;
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
    }
    #agas88-scheduler .table-container {
      padding: 0 15px;
      overflow-x: auto;
    }
    #agas88-scheduler table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 10px;
    }
    #agas88-scheduler table th {
      background-color: #f8f9fa;
      padding: 12px 8px;
      border-bottom: 2px solid #dee2e6;
      font-size: 13px;
      text-align: left;
      color: #333;
    }
    #agas88-scheduler table td {
      padding: 8px;
      border-bottom: 1px solid #eee;
      vertical-align: middle;
    }
    #agas88-scheduler select, 
    #agas88-scheduler input[type="date"] {
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #ddd;
      outline: none;
      font-size: 13px;
      background-color: #fff;
    }
    #agas88-scheduler .status-badge {
      background-color: #28a745;
      color: white;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: bold;
      display: inline-block;
      text-align: center;
    }
    #agas88-scheduler .btn-group {
      margin-bottom: 15px;
      display: flex;
      gap: 10px;
    }
    #agas88-scheduler .btn-add {
      background-color: #0056b3;
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: background 0.2s;
    }
    #agas88-scheduler .btn-add:hover {
      background-color: #004085;
    }
    #agas88-scheduler .btn-del {
      background-color: #dc3545;
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
      transition: background 0.2s;
    }
    #agas88-scheduler .btn-del:hover {
      background-color: #bd2130;
    }
    #agas88-scheduler .btn-wa {
      background-color: #25D366;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      font-weight: bold;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 10px;
      transition: background 0.2s;
    }
    #agas88-scheduler .btn-wa:hover {
      background-color: #128C7E;
    }
    #agas88-scheduler .footer-info {
      background-color: #fdfdfd;
      padding: 20px;
      border-top: 1px solid #eee;
    }
    #agas88-scheduler .info-row {
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
    }
    #agas88-scheduler .total-count {
      font-weight: bold;
      color: #0056b3;
      font-size: 18px;
    }
    #agas88-scheduler .link-box {
      text-align: center;
      padding: 15px;
      background: #f0f7ff;
    }
    #agas88-scheduler .link-box a {
      color: #0056b3;
      text-decoration: none;
      font-weight: bold;
    }
    #agas88-scheduler .signature {
      text-align: center;
      padding: 15px;
      font-size: 12px;
      color: #888;
    }
  </style>

  <div class="card">
    <div class="header">
      <h2>PT. AGAS88</h2>
      <p style="color:#666; font-size: 14px; margin-top: 5px; margin-bottom: 5px;">Update Keberangkatan Kapal</p>
      <!-- Menampilkan Waktu Real-Time WITA -->
      <div id="liveClock" class="realtime-clock">Waktu: --:--:-- WITA</div>
    </div>

    <div class="table-container">
      <div class="btn-group">
        <button type="button" class="btn-add" onclick="addRowAGAS()">+ Tambah Kapal</button>
      </div>
      <table id="shipTable">
        <thead>
          <tr>
            <th width="10%">No</th>
            <th width="60%">Nama Kapal</th>
            <th width="20%">Status</th>
            <th width="10%">Aksi</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td class="row-number">01</td>
            <td>
              <select class="ship-select">
                <option selected>KLM. SUMBER RIZKY</option>
                <option>KLM. SUMBER RIZKY 02</option>
                <option>KLM. SUMBER REZKY A</option>
                <option>KLM. BERKAH BUAH</option>
                <option>KLM. ADI RAHMATULLAH PUTRA</option>
                <option>KLM. SUMBER REZKY B</option>
                <option>KLM. QUDRAT ILAHI</option>
                <option>KLM. FIRDAH JAYA 03</option>
                <option>KLM. SYUKRAN 3</option>
                <option>KLM. SYUKRAN 03</option>
                <option>KLM. BUNGA RIZKA</option>
                <option>KLM. SURYA UTAMA 77</option>
                <option>KLM. MARHABAN 02</option>
                <option>KLM. BERKAT SABAR 05</option>
                <option>KLM. BERKAH ILAHI 99</option>
                <option>KLM. PUTRA KARAYAAN 01</option>
                <option>KLM. SUMBER REZKY 88</option>
                <option>KLM. ANUGERAH REZKY PUTRA</option>
              </select>
            </td>
            <td><span class="status-badge">READY</span></td>
            <td></td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="footer-info">
      <div class="info-row">
        <span>Tanggal Berangkat:</span>
        <div style="width: 50%;">
          <input type="date" id="shipDate">
        </div>
      </div>
      <div class="info-row">
        <span>Total Kapal Siap Berangkat:</span>
        <span class="total-count" id="totalShips">1 Unit</span>
      </div>
      
      <!-- Tombol WhatsApp -->
      <button type="button" class="btn-wa" onclick="shareWhatsAppAGAS()">
        <svg width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
          <path d="M13.601 2.326A7.854 7.854 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c0 1.399.366 2.76 1.057 3.965L0 16l4.204-1.102a7.933 7.933 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.93-7.93A7.898 7.898 0 0 0 13.6 2.326zM7.994 14.521a6.573 6.573 0 0 1-3.356-.92l-.24-.144-2.494.654.666-2.433-.156-.251a6.56 6.56 0 0 1-1.007-3.505c0-3.626 2.957-6.584 6.591-6.584a6.56 6.56 0 0 1 4.66 1.931 6.557 6.557 0 0 1 1.928 4.66c-.004 3.639-2.961 6.592-6.592 6.592zm3.615-4.934c-.197-.099-1.17-.578-1.353-.646-.182-.065-.315-.099-.445.099-.133.197-.513.646-.627.775-.114.133-.232.148-.43.05-.197-.1-.836-.308-1.592-.985-.59-.525-.985-1.175-1.103-1.372-.114-.198-.011-.304.088-.403.087-.088.197-.232.296-.346.1-.114.133-.198.198-.33.065-.134.034-.248-.015-.347-.05-.099-.445-1.076-.612-1.47-.16-.389-.323-.335-.445-.34-.114-.007-.247-.007-.38-.007a.729.729 0 0 0-.529.247c-.182.198-.691.677-.691 1.654 0 .977.71 1.916.81 2.049.098.133 1.394 2.132 3.383 2.992.47.205.84.326 1.129.418.475.152.904.129 1.246.08.38-.058 1.171-.48 1.338-.943.164-.464.164-.86.114-.943-.049-.084-.182-.133-.38-.232z"/>
        </svg>
        Bagikan ke WhatsApp
      </button>
    </div>

    <div class="link-box">
      <a href="http://www.agas88.web.id" target="_blank">www.agas88.web.id/agas</a>
    </div>

    <div class="signature">Hormat Kami, <br><strong>PT. AGAS88</strong></div>
  </div>
</div>

<script type="text/javascript">
  function getWITATime() {
    // Memaksa konversi zona waktu spesifik ke Asia/Makassar (WITA)
    const now = new Date();
    const options = {
      timeZone: 'Asia/Makassar',
      hour: '2-digit',
      minute: '2-digit',
      second: '2-digit',
      hour12: false
    };
    return new Intl.DateTimeFormat('id-ID', options).format(now).replace(/\./g, ':');
  }

  function updateClockAGAS() {
    const clockElem = document.getElementById('liveClock');
    if (clockElem) {
      clockElem.innerText = `Waktu: ${getWITATime()} WITA`;
    }
  }

  // Update jam setiap 1 detik
  setInterval(updateClockAGAS, 1000);
  updateClockAGAS();

  function updateCountAGAS() {
    const rows = document.querySelectorAll('#agas88-scheduler #shipTable tbody tr');
    document.getElementById('totalShips').innerText = rows.length + " Unit";
    
    rows.forEach((row, index) => {
      row.querySelector('.row-number').innerText = (index + 1).toString().padStart(2, '0');
    });
  }

  function addRowAGAS() {
    const tableBody = document.querySelector("#agas88-scheduler #shipTable tbody");
    const newRow = document.createElement('tr');
    
    const options = `
      <option>KLM. SUMBER RIZKY</option><option>KLM. SUMBER RIZKY 02</option><option>KLM. SUMBER REZKY A</option>
      <option>KLM. BERKAH BUAH</option><option>KLM. ADI RAHMATULLAH PUTRA</option><option>KLM. SUMBER REZKY B</option>
      <option>KLM. QUDRAT ILAHI</option><option>KLM. FIRDAH JAYA 03</option><option>KLM. SYUKRAN 3</option>
      <option>KLM. SYUKRAN 03</option><option>KLM. BUNGA RIZKA</option><option>KLM. SURYA UTAMA 77</option>
      <option>KLM. MARHABAN 02</option><option>KLM. BERKAT SABAR 05</option><option>KLM. BERKAH ILAHI 99</option>
      <option>KLM. PUTRA KARAYAAN 01</option><option>KLM. SUMBER REZKY 88</option><option>KLM. ANUGERAH REZKY PUTRA</option>
    `;

    newRow.innerHTML = `
      <td class="row-number"></td>
      <td><select class="ship-select">${options}</select></td>
      <td><span class="status-badge">READY</span></td>
      <td><button type="button" class="btn-del" onclick="deleteRowAGAS(this)">Hapus</button></td>
    `;
    tableBody.appendChild(newRow);
    updateCountAGAS();
  }

  function deleteRowAGAS(btn) {
    btn.closest('tr').remove();
    updateCountAGAS();
  }

  function shareWhatsAppAGAS() {
    const dateInput = document.getElementById('shipDate');
    let formattedDate = "";
    
    if (dateInput.value) {
      formattedDate = dateInput.value.split('-').reverse().join('/');
    } else {
      const today = new Date();
      formattedDate = String(today.getDate()).padStart(2, '0') + '/' + 
                      String(today.getMonth() + 1).padStart(2, '0') + '/' + 
                      today.getFullYear();
    }

    const currentTimeWITA = getWITATime() + ' WITA';

    let shipListText = "";
    const rows = document.querySelectorAll('#agas88-scheduler #shipTable tbody tr');
    rows.forEach((row, index) => {
      const no = (index + 1).toString().padStart(2, '0');
      const shipName = row.querySelector('.ship-select').value;
      shipListText += `${no}. ${shipName}\n`;
    });

    const message = `Δ *Yth. Petugas Karantina, mohon tindak lanjut atas permohonan karantina PT.AGAS88, yang telah saya ajukan secara online.* Δ\n` +
                    `*Update* Δ ${formattedDate} (${currentTimeWITA})\n\n` +
                    `Δ *KAPAL SIAP BERANGKAT:* Δ\n` +
                    `${shipListText}\n` +
                    `Δ *Detail Operasional:* Δ\n` +
                    `Perusahaan: PT. AGAS88\n` +
                    `Total Kapal: ${rows.length} Unit\n` +
                    `Website Resmi: www.agas88.web.id\n\n` +
                    `Atas kerja samanya diucapkan *Terima kasih*.`;

    const encodedMessage = encodeURIComponent(message);
    const whatsappUrl = `https://wa.me/?text=${encodedMessage}`;
    window.open(whatsappUrl, '_blank');
  }

  // Set tanggal bawaan ke hari ini
  (function initAGASDate() {
    const today = new Date();
    const yyyy = today.getFullYear();
    const mm = String(today.getMonth() + 1).padStart(2, '0');
    const dd = String(today.getDate()).padStart(2, '0');
    const dateElem = document.getElementById('shipDate');
    if (dateElem) {
      dateElem.value = `${yyyy}-${mm}-${dd}`;
    }
  })();

  updateCountAGAS();
</script>
