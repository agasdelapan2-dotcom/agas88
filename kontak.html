  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .contact-container {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    }

    .contact-title {
      font-size: 28px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .contact-subtitle {
      text-align: center;
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 500;
      color: #e2e8f0;
    }

    .form-control {
      width: 100%;
      padding: 12px 16px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      color: #ffffff;
      font-size: 14px;
      transition: all 0.3s ease;
      outline: none;
    }

    .form-control:focus {
      border-color: #00f2fe;
      box-shadow: 0 0 10px rgba(0, 242, 254, 0.3);
    }

    textarea.form-control {
      resize: vertical;
      min-height: 120px;
    }

    /* Group Tombol Aksi */
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 10px;
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #00f2fe, #4facfe);
      border: none;
      border-radius: 10px;
      color: #0f172a;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 242, 254, 0.4);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Style Tombol Lihat Pesan */
    .btn-view-sheet {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      color: #f8fafc;
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .btn-view-sheet:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: #00f2fe;
      color: #00f2fe;
      transform: translateY(-2px);
    }

    .btn-view-sheet svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .alert {
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      text-align: center;
      margin-bottom: 20px;
      display: none;
    }

    .alert-success {
      background: rgba(34, 197, 94, 0.2);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.4);
    }

    .alert-error {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }
.float-home-pulse {
  position: fixed;
  bottom: 25px;
  left: 25px; /* Bisa diganti ke 'right: 25px' jika ingin di kanan */
  width: 55px;
  height: 55px;
  background: linear-gradient(135deg, #ff007f, #7928ca);
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
  color: #ffffff;
  text-decoration: none;
  z-index: 9999;
  box-shadow: 0 10px 25px rgba(121, 40, 202, 0.5);
  transition: all 0.3s ease;
}

.float-home-pulse .icon-home {
  width: 26px;
  height: 26px;
  fill: #ffffff;
  z-index: 2;
  transition: transform 0.3s ease;
}

.pulse-ring {
  position: absolute;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  background: rgba(255, 0, 127, 0.4);
  animation: pulse-animation 2s infinite;
  z-index: 1;
}

@keyframes pulse-animation {
  0% {
    transform: scale(0.95);
    box-shadow: 0 0 0 0 rgba(255, 0, 127, 0.7);
  }
  70% {
    transform: scale(1.4);
    box-shadow: 0 0 0 12px rgba(255, 0, 127, 0);
  }
  100% {
    transform: scale(0.95);
    box-shadow: 0 0 0 0 rgba(255, 0, 127, 0);
  }
}

.float-home-pulse:hover {
  transform: rotate(360deg) scale(1.1);
}
  </style>
</head>
<body>

  <div class="contact-container">
    <h1 class="contact-title">Kirim Pesan</h1>
    <p class="contact-subtitle">Punya pertanyaan atau masukan? Silakan isi formulir di bawah ini.</p>

    <!-- Notifikasi -->
    <div id="alertSuccess" class="alert alert-success">Pesan Anda berhasil terkirim! Terima kasih.</div>
    <div id="alertError" class="alert alert-error">Gagal mengirim pesan. Silakan coba lagi.</div>

    <form id="contactForm">
      <div class="form-group">
        <label for="nama">Nama Lengkap</label>
        <input type="text" id="nama" name="nama" class="form-control" placeholder="Masukkan nama Anda" required>
      </div>

      <div class="form-group">
        <label for="email">Alamat Email</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="nama@email.com" required>
      </div>

      <div class="form-group">
        <label for="pesan">Pesan</label>
        <textarea id="pesan" name="pesan" class="form-control" placeholder="Tuliskan pesan Anda di sini..." required></textarea>
      </div>

      <div class="btn-group">
        <!-- Tombol Kirim Pesan -->
        <button type="submit" id="submitBtn" class="btn-submit">Kirim Pesan</button>
        
        <!-- Tombol Lihat Pesan (Spreadsheet) -->
        <a href="https://docs.google.com/spreadsheets/d/1RtZDK9bX8pM_kDBzMn7dRYwqMqxGaEl4ZBAHoDCymcw/edit?usp=sharing" target="_blank" rel="noopener noreferrer" class="btn-view-sheet">
          <svg viewBox="0 0 24 24">
            <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zM7 7h10v2H7zm0 4h10v2H7zm0 4h7v2H7z"/>
          </svg>
          Lihat Pesan (Spreadsheet)
        </a>
      </div>
    </form>
  </div>

  <script>
    // GANTI URL DI BAWAH INI DENGAN URL WEB APP GOOGLE APPS SCRIPT ANDA
    const scriptURL = 'URL_SCRIPT_GOOGLE_ANDA_DI_SINI';
    
    const form = document.getElementById('contactForm');
    const submitBtn = document.getElementById('submitBtn');
    const alertSuccess = document.getElementById('alertSuccess');
    const alertError = document.getElementById('alertError');

    form.addEventListener('submit', e => {
      e.preventDefault();
      
      submitBtn.disabled = true;
      submitBtn.innerText = 'Mengirim...';
      alertSuccess.style.display = 'none';
      alertError.style.display = 'none';

      fetch(scriptURL, { method: 'POST', body: new FormData(form)})
        .then(response => {
          submitBtn.disabled = false;
          submitBtn.innerText = 'Kirim Pesan';
          alertSuccess.style.display = 'block';
          form.reset();
        })
        .catch(error => {
          submitBtn.disabled = false;
          submitBtn.innerText = 'Kirim Pesan';
          alertError.style.display = 'block';
          console.error('Error!', error.message);
        });
    });
  </script>
<a href="https://agas88.web.id/" class="float-home-pulse" title="Kembali ke Utama">
  <div class="pulse-ring"></div>
  <svg viewBox="0 0 24 24" class="icon-home">
    <path d="M12 3L2 12h3v8h6v-6h2v6h6v-8h3L12 3z"/>
