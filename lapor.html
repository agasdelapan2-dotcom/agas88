<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Laporan Kapal WhatsApp</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f4f8;
        }
        .preview-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .preview-scroll::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 4px;
        }
        .preview-scroll::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .preview-scroll::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen pb-12">

    <!-- Header Navbar -->
            <!-- Form Input (7 Cols Desktop) -->
            <div class="lg:col-span-7 space-y-6">

                <!-- Form Keberangkatan Card -->
                <div id="cardDeparture" class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden transition-all duration-300">
                    <div class="bg-gradient-to-r from-blue-700 to-indigo-700 px-5 py-3.5 text-white flex justify-between items-center">
                        <div class="flex items-center space-x-2">
                            <i class="fa-solid fa-plane-departure text-amber-300"></i>
                            <h2 class="font-bold tracking-wide text-sm sm:text-base">KEBERANGKATAN KAPAL</h2>
                        </div>
                        <span class="text-xs bg-blue-800/80 px-2.5 py-1 rounded-full text-blue-100 font-mono">OUTBOUND</span>
                    </div>
                    <div class="p-5 grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div class="sm:col-span-2">
                            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">KLM (Pilih Nama Kapal)</label>
                            <div class="relative">
                                <i class="fa-solid fa-ship absolute left-3 top-3 text-slate-400 text-sm z-10 pointer-events-none"></i>
                                <select id="depKlmSelect" class="w-full pl-9 pr-8 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 appearance-none bg-white font-medium text-slate-700">
                                    <option value="KLM.SUMBER RIZKY">KLM.SUMBER RIZKY</option>
                                    <option value="KLM.SUMBER RIZKY 02">KLM.SUMBER RIZKY 02</option>
                                    <option value="KLM.SUMBER REZKY A">KLM.SUMBER REZKY A</option>
                                    <option value="KLM.ADI RAHMATULLAH PUTRA">KLM.ADI RAHMATULLAH PUTRA</option>
                                    <option value="KLM.SUMBER REZKY B">KLM.SUMBER REZKY B</option>
                                    <option value="KLM.QUDRAT ILAHI">KLM.QUDRAT ILAHI</option>
                                    <option value="KLM.FIRDAH JAYA 03">KLM.FIRDAH JAYA 03</option>
                                    <option value="KLM.SYUKRAN 3">KLM.SYUKRAN 3</option>
                                    <option value="KLM.SYUKRAN 03">KLM.SYUKRAN 03</option>
                                    <option value="KLM.BUNGA RIZKA" selected>KLM.BUNGA RIZKA</option>
                                    <option value="KLM.SURYA UTAMA 77">KLM.SURYA UTAMA 77</option>
                                    <option value="KLM.MARHABAN 02">KLM.MARHABAN 02</option>
                                    <option value="KLM.BERKAT SABAR 05">KLM.BERKAT SABAR 05</option>
                                    <option value="KLM.BERKAH ILAHI 99">KLM.BERKAH ILAHI 99</option>
                                    <option value="KLM.SUMBER REZKY 88">KLM.SUMBER REZKY 88</option>

                                </select>
                                <i class="fa-solid fa-chevron-down absolute right-3 top-3 text-slate-400 text-xs pointer-events-none"></i>
                            </div>
                            <div id="depKlmCustomContainer" class="mt-2 hidden">
                                <input type="text" id="depKlmCustom" placeholder="Ketik nama KLM manual..." class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 uppercase">
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">TUJUAN</label>
                            <div class="relative">
                                <i class="fa-solid fa-location-dot absolute left-3 top-3 text-slate-400 text-sm"></i>

                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">BRKT. TGL</label>
                            <div class="relative">
                                <i class="fa-solid fa-calendar-days absolute left-3 top-3 text-slate-400 text-sm"></i>
                                <input type="text" id="depTgl" value="24-9-2026" class="w-full pl-9 pr-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">JAM</label>
                            <div class="relative">
                                <i class="fa-solid fa-clock absolute left-3 top-3 text-slate-400 text-sm"></i>
                                <input type="text" id="depJam" value="04:00" class="w-full pl-9 pr-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">CREW (Jumlah ABK)</label>
                            <div class="relative">
                                <i class="fa-solid fa-users absolute left-3 top-3 text-slate-400 text-sm"></i>
                                <input type="text" id="depCrew" value="4" class="w-full pl-9 pr-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Form Kedatangan Card -->
                <div id="cardArrival" class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden transition-all duration-300">
                    <div class="bg-gradient-to-r from-teal-700 to-emerald-700 px-5 py-3.5 text-white flex justify-between items-center">
                        <div class="flex items-center space-x-2">
                            <i class="fa-solid fa-plane-arrival text-emerald-300"></i>
                            <h2 class="font-bold tracking-wide text-sm sm:text-base">KEDATANGAN KAPAL</h2>
                        </div>
                        <span class="text-xs bg-teal-800/80 px-2.5 py-1 rounded-full text-emerald-100 font-mono">INBOUND</span>
                    </div>
                    <div class="p-5 grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div class="sm:col-span-2">
                            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">KLM (Pilih Nama Kapal)</label>
                            <div class="relative">
                                <i class="fa-solid fa-ship absolute left-3 top-3 text-slate-400 text-sm z-10 pointer-events-none"></i>
                                <select id="arrKlmSelect" class="w-full pl-9 pr-8 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:border-teal-500 appearance-none bg-white font-medium text-slate-700">
                                    <option value="KLM.SUMBER RIZKY">KLM.SUMBER RIZKY</option>
                                    <option value="KLM.SUMBER RIZKY 02">KLM.SUMBER RIZKY 02</option>
                                    <option value="KLM.SUMBER REZKY A">KLM.SUMBER REZKY A</option>
                                    <option value="KLM.ADI RAHMATULLAH PUTRA">KLM.ADI RAHMATULLAH PUTRA</option>
                                    <option value="KLM.SUMBER REZKY B">KLM.SUMBER REZKY B</option>
                                    <option value="KLM.QUDRAT ILAHI">KLM.QUDRAT ILAHI</option>
                                    <option value="KLM.FIRDAH JAYA 03">KLM.FIRDAH JAYA 03</option>
                                    <option value="KLM.SYUKRAN 3">KLM.SYUKRAN 3</option>
                                    <option value="KLM.SYUKRAN 03">KLM.SYUKRAN 03</option>
                                    <option value="KLM.BUNGA RIZKA">KLM.BUNGA RIZKA</option>
                                    <option value="KLM.SURYA UTAMA 77">KLM.SURYA UTAMA 77</option>
                                    <option value="KLM.MARHABAN 02">KLM.MARHABAN 02</option>
                                    <option value="KLM.BERKAT SABAR 05">KLM.BERKAT SABAR 05</option>
                                    <option value="KLM.BERKAH ILAHI 99">KLM.BERKAH ILAHI 99</option>
                                    <option value="KLM.SUMBER REZKY 88" selected>KLM.SUMBER REZKY 88</option>
                                    <option value="KLM.ANUGERAH REZKY PUTRA">KLM.ANUGERAH REZKY PUTRA</option>
                                    <option value="CUSTOM">-- Custom / Input Manual --</option>
                                </select>
                                <i class="fa-solid fa-chevron-down absolute right-3 top-3 text-slate-400 text-xs pointer-events-none"></i>
                            </div>
                            <div id="arrKlmCustomContainer" class="mt-2 hidden">
                                <input type="text" id="arrKlmCustom" placeholder="Ketik nama KLM manual..." class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:border-teal-500 uppercase">
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">ASAL</label>
                            <div class="relative">
                                <i class="fa-solid fa-location-arrow absolute left-3 top-3 text-slate-400 text-sm"></i>
                                <input type="text" id="arrAsal" value="SAMARINDA" class="w-full pl-9 pr-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:border-teal-500 uppercase">
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">TIBA. TGL</label>
                            <div class="relative">
                                <i class="fa-solid fa-calendar-check absolute left-3 top-3 text-slate-400 text-sm"></i>
                                <input type="text" id="arrTgl" value="24/9/2026" class="w-full pl-9 pr-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:border-teal-500">
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">JAM</label>
                            <div class="relative">
                                <i class="fa-solid fa-clock absolute left-3 top-3 text-slate-400 text-sm"></i>
                                <input type="text" id="arrJam" value="06:00" class="w-full pl-9 pr-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:border-teal-500">
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">CREW (Jumlah ABK)</label>
                            <div class="relative">
                                <i class="fa-solid fa-users absolute left-3 top-3 text-slate-400 text-sm"></i>
                                <input type="text" id="arrCrew" value="5" class="w-full pl-9 pr-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:border-teal-500">
                            </div>
                        </div>
                    </div>
                </div>

            </div>

            <!-- Live Preview Panel (5 Cols Desktop) -->
            <div class="lg:col-span-5">
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 sticky top-24 space-y-4">
                    <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                        <div class="flex items-center space-x-2">
                            <i class="fa-solid fa-eye text-emerald-600"></i>
                            <h3 class="font-bold text-slate-800">Pratinjau Pesan WA</h3>
                        </div>
                        <span class="text-xs px-2.5 py-0.5 rounded-full bg-emerald-100 text-emerald-800 font-semibold flex items-center gap-1">
                            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Live Output
                        </span>
                    </div>

                    <!-- Visual Box Tampilan Pesan WhatsApp -->
                    <div class="bg-[#efeae2] border border-slate-300 rounded-xl p-4 shadow-inner relative min-h-[220px]">
                        <!-- Background Pattern Mock Chat WA -->
                        <div class="absolute inset-0 opacity-10 pointer-events-none rounded-xl" style="background-image: radial-gradient(#000 1px, transparent 1px); background-size: 12px 12px;"></div>
                        
                        <!-- Bubble Chat WA -->
                        <div class="bg-white rounded-lg p-3.5 shadow-sm text-slate-800 font-mono text-sm leading-snug whitespace-pre relative z-10 overflow-x-auto preview-scroll max-h-[380px]" id="previewText">
                            <!-- Text render injected via Javascript -->
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div class="pt-2 space-y-3">
                        <!-- Send to WA Button -->
                        <button onclick="shareWhatsApp()" class="w-full py-3.5 px-4 bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-bold rounded-xl shadow-md hover:shadow-lg transition-all flex items-center justify-center space-x-2 text-base group">
                            <i class="fa-brands fa-whatsapp text-2xl group-hover:scale-110 transition-transform"></i>
                            <span>Kirim ke WhatsApp</span>
                        </button>

                        <!-- Copy to Clipboard Button -->
                        <button onclick="copyMessage()" class="w-full py-2.5 px-4 bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-slate-700 font-semibold rounded-xl border border-slate-300 transition-all flex items-center justify-center space-x-2 text-sm">
                            <i class="fa-regular fa-copy text-slate-500"></i>
                            <span>Salin Teks Pesan</span>
                        </button>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-5 right-5 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-2xl flex items-center space-x-3 translate-y-20 opacity-0 transition-all duration-300 z-50 pointer-events-none">
        <i class="fa-solid fa-circle-check text-emerald-400 text-lg"></i>
        <span id="toastMessage" class="text-sm font-medium">Pesan berhasil disalin!</span>
    </div>

    <script>
        // DOM Elements
        const depKlmSelect = document.getElementById('depKlmSelect');
        const depKlmCustomContainer = document.getElementById('depKlmCustomContainer');
        const depKlmCustom = document.getElementById('depKlmCustom');
        const depTujuan = document.getElementById('depTujuan');
        const depTgl = document.getElementById('depTgl');
        const depJam = document.getElementById('depJam');
        const depCrew = document.getElementById('depCrew');

        const arrKlmSelect = document.getElementById('arrKlmSelect');
        const arrKlmCustomContainer = document.getElementById('arrKlmCustomContainer');
        const arrKlmCustom = document.getElementById('arrKlmCustom');
        const arrAsal = document.getElementById('arrAsal');
        const arrTgl = document.getElementById('arrTgl');
        const arrJam = document.getElementById('arrJam');
        const arrCrew = document.getElementById('arrCrew');

        const previewText = document.getElementById('previewText');
        const reportTypeRadios = document.querySelectorAll('input[name="reportType"]');
        const cardDeparture = document.getElementById('cardDeparture');
        const cardArrival = document.getElementById('cardArrival');

        // Helper to format KLM name (remove KLM. prefix if present to match target output format cleanly)
        function cleanShipName(value) {
            if (!value) return '';
            return value.replace(/^KLM\.\s*/i, '').trim();
        }

        // Get actual chosen ship name
        function getShipName(selectEl, customEl) {
            if (selectEl.value === 'CUSTOM') {
                return customEl.value.trim() || '-';
            }
            return cleanShipName(selectEl.value);
        }

        // Generate formatted text string
        function generateMessageText() {
            const selectedType = document.querySelector('input[name="reportType"]:checked').value;
            let text = '';

            const depShip = getShipName(depKlmSelect, depKlmCustom);
            const arrShip = getShipName(arrKlmSelect, arrKlmCustom);

            const departurePart = 
`KEBERANGKATAN 
KLM  : ${depShip}
TUJUAN    : ${depTujuan.value.trim()}
BRKT. TGL : ${depTgl.value.trim()}
JAM.           : ${depJam.value.trim()}
CREW         : ${depCrew.value.trim()}`;

            const arrivalPart = 
`KEDATANGAN
KLM  : ${arrShip}
Asal  : ${arrAsal.value.trim()}
Tiba. : ${arrTgl.value.trim()}
Jam  : ${arrJam.value.trim()}
Crew : ${arrCrew.value.trim()}`;

            if (selectedType === 'both') {
                text = `${departurePart}\n\n\n${arrivalPart}`;
            } else if (selectedType === 'departure') {
                text = departurePart;
            } else if (selectedType === 'arrival') {
                text = arrivalPart;
            }

            return text;
        }

        // Handle custom ship input toggles
        function handleDropdownChange(selectEl, containerEl) {
            if (selectEl.value === 'CUSTOM') {
                containerEl.classList.remove('hidden');
            } else {
                containerEl.classList.add('hidden');
            }
            updatePreview();
        }

        // Update Live Preview Box & Toggle Card Visibility
        function updatePreview() {
            const selectedType = document.querySelector('input[name="reportType"]:checked').value;
            
            if (selectedType === 'both') {
                cardDeparture.classList.remove('hidden');
                cardArrival.classList.remove('hidden');
            } else if (selectedType === 'departure') {
                cardDeparture.classList.remove('hidden');
                cardArrival.classList.add('hidden');
            } else if (selectedType === 'arrival') {
                cardDeparture.classList.add('hidden');
                cardArrival.classList.remove('hidden');
            }

            previewText.textContent = generateMessageText();
        }

        // Share Message to WhatsApp
        function shareWhatsApp() {
            const rawText = generateMessageText();
            const encodedText = encodeURIComponent(rawText);
            const waUrl = `https://api.whatsapp.com/send?text=${encodedText}`;
            window.open(waUrl, '_blank');
        }

        // Copy message to clipboard using document.execCommand fallback
        function copyMessage() {
            const textToCopy = generateMessageText();
            
            const tempArea = document.createElement('textarea');
            tempArea.value = textToCopy;
            document.body.appendChild(tempArea);
            tempArea.select();
            
            try {
                document.execCommand('copy');
                showToast('Pesan berhasil disalin ke clipboard!');
            } catch (err) {
                showToast('Gagal menyalin pesan.');
            } font-semibold {
                document.body.removeChild(tempArea);
            }
        }

        // Toast Notification Function
        function showToast(msg) {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            
            toastMessage.textContent = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2500);
        }

        // Attach Event Listeners
        depKlmSelect.addEventListener('change', () => handleDropdownChange(depKlmSelect, depKlmCustomContainer));
        arrKlmSelect.addEventListener('change', () => handleDropdownChange(arrKlmSelect, arrKlmCustomContainer));

        const allInputs = [depKlmCustom, depTujuan, depTgl, depJam, depCrew, arrKlmCustom, arrAsal, arrTgl, arrJam, arrCrew];
        allInputs.forEach(input => {
            input.addEventListener('input', updatePreview);
        });

        reportTypeRadios.forEach(radio => {
            radio.addEventListener('change', updatePreview);
        });

        // Initialize display on startup
        window.onload = function() {
            updatePreview();
        };
    </script>
</body>
</html>
