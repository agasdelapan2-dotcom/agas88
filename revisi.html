<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Layanan Muatan Kapal Hari Ini</title>
    <!-- Favicon & App Icon -->
  <link rel="icon" href="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhDqSFwR3tb6e8ZGAl3MwMfK4Q-HTw9wwMlQhj1nzNGA6tVs8h5pM1nks5zOWO6oNG5osQzJfNXq8PdLrHfHqw3WjXMaNWdWwCyhBsppLYucD4lnMfo7LYX6zv0vj5RIoQFSD2D8gYJhtZ2FIhRVf5GN-x-Nb-_xbyRhdYmimhjaN72xJkGD586LHNjzPrv/s500/agas-88.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhDqSFwR3tb6e8ZGAl3MwMfK4Q-HTw9wwMlQhj1nzNGA6tVs8h5pM1nks5zOWO6oNG5osQzJfNXq8PdLrHfHqw3WjXMaNWdWwCyhBsppLYucD4lnMfo7LYX6zv0vj5RIoQFSD2D8gYJhtZ2FIhRVf5GN-x-Nb-_xbyRhdYmimhjaN72xJkGD586LHNjzPrv/s500/agas-88.png">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f4f8;
            color: #333;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #1e3a8a;
        }

        /* Tab Navigation */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 15px;
            border: none;
            background-color: #cbd5e1;
            color: #334155;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px 8px 0 0;
            transition: background 0.3s;
        }

        .tab-btn.active {
            background-color: #2563eb;
            color: white;
        }

        /* Form Container */
        .tab-content {
            display: none;
            background: white;
            padding: 30px;
            border-radius: 0 0 8px 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .tab-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #1e293b;
        }

        select, input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
        }

        select:focus, input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: #16a34a;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }

        .btn-submit:hover {
            background-color: #15803d;
        }

        /* Area Cetak Dokumen */
        #output-area {
            margin-top: 30px;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: none;
        }

        .doc-header {
            text-align: center;
            border-bottom: 2px solid #333;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .doc-header h2 {
            text-transform: uppercase;
            font-size: 20px;
            color: #0f172a;
        }

        .doc-details {
            margin-bottom: 20px;
            line-height: 1.8;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        table, th, td {
            border: 1px solid #333;
        }

        th, td {
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #f1f5f9;
        }

        /* Container Tombol Aksi */
        .action-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-action {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: opacity 0.2s;
        }

        .btn-action:hover {
            opacity: 0.9;
        }

        .btn-print {
            background-color: #0284c7;
            color: white;
        }

        .btn-whatsapp {
            background-color: #25d366;
            color: white;
        }

        @media print {
            body * {
                visibility: hidden;
            }
            #output-area, #output-area * {
                visibility: visible;
            }
            #output-area {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                box-shadow: none;
                padding: 0;
            }
            .action-buttons {
                display: none;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Sistem Manajemen Muatan Kapal</h1>

    <!-- Navigasi Tab -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('perubahan')">Form Perubahan Muatan</button>
        <button class="tab-btn" onclick="switchTab('dokumen-baru')">Form Dokumen Baru</button>
    </div>

    <!-- TAB 1: FORM PERUBAHAN MUATAN -->
    <div id="tab-perubahan" class="tab-content active">
        <form id="formPerubahan" onsubmit="generateDocument(event, 'Perubahan Muatan')">
            <div class="grid-2">
                <div class="form-group">
                    <label for="pengirim-perubahan">Nama Pengirim:</label>
                    <select id="pengirim-perubahan" required>
                        <!-- Opsi pengirim diisi oleh JavaScript -->
                    </select>
                </div>
                <div class="form-group">
                    <label for="kapal-perubahan">Nama Kapal:</label>
                    <select id="kapal-perubahan" required>
                        <!-- Opsi kapal diisi oleh JavaScript -->
                    </select>
                </div>
            </div>

            <label>Rincian Perubahan Muatan:</label>
            <div class="grid-3">
                <div class="form-group">
                    <label for="sayur-perubahan">Sayuran (Kg):</label>
                    <input type="number" id="sayur-perubahan" value="8000" min="0" required>
                </div>
                <div class="form-group">
                    <label for="buah-perubahan">Buah (Kg):</label>
                    <input type="number" id="buah-perubahan" value="2000" min="0" required>
                </div>
                <div class="form-group">
                    <label for="ikan-perubahan">Ikan (Kg):</label>
                    <input type="number" id="ikan-perubahan" value="5000" min="0" required>
                </div>
            </div>

            <button type="submit" class="btn-submit">Proses Perubahan Muatan</button>
        </form>
    </div>

    <!-- TAB 2: FORM DOKUMEN BARU -->
    <div id="tab-dokumen-baru" class="tab-content">
        <form id="formBaru" onsubmit="generateDocument(event, 'Dokumen Baru')">
            <div class="grid-2">
                <div class="form-group">
                    <label for="pengirim-baru">Nama Pengirim:</label>
                    <select id="pengirim-baru" required>
                        <!-- Opsi pengirim diisi oleh JavaScript -->
                    </select>
                </div>
                <div class="form-group">
                    <label for="kapal-baru">Nama Kapal:</label>
                    <select id="kapal-baru" required>
                        <!-- Opsi kapal diisi oleh JavaScript -->
                    </select>
                </div>
            </div>

            <label>Rincian Muatan Baru:</label>
            <div class="grid-3">
                <div class="form-group">
                    <label for="sayur-baru">Sayuran (Kg):</label>
                    <input type="number" id="sayur-baru" value="8000" min="0" required>
                </div>
                <div class="form-group">
                    <label for="buah-baru">Buah (Kg):</label>
                    <input type="number" id="buah-baru" value="2000" min="0" required>
                </div>
                <div class="form-group">
                    <label for="ikan-baru">Ikan (Kg):</label>
                    <input type="number" id="ikan-baru" value="5000" min="0" required>
                </div>
            </div>

            <button type="submit" class="btn-submit" style="background-color: #2563eb;">Buat Dokumen Baru</button>
        </form>
    </div>

    <!-- PRATINJAU / HASIL DOKUMEN -->
    <div id="output-area">
        <div class="doc-header">
            <h2 id="doc-title">DOKUMEN MUATAN KAPAL</h2>
            <p>Tanggal Diterbitkan: <span id="doc-date"></span></p>
        </div>
        <div class="doc-details">
            <p><strong>Nama Pengirim:</strong> <span id="doc-sender"></span></p>
            <p><strong>Jenis Pengajuan:</strong> <span id="doc-type"></span></p>
            <p><strong>Nama Kapal:</strong> <span id="doc-ship"></span></p>
        </div>
        <table>
            <thead>
                <tr>
                    <th>No</th>
                    <th>Jenis Barang</th>
                    <th>Jumlah (Kg)</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1</td>
                    <td>Sayuran</td>
                    <td id="doc-sayur">0</td>
                </tr>
                <tr>
                    <td>2</td>
                    <td>Buah</td>
                    <td id="doc-buah">0</td>
                </tr>
                <tr>
                    <td>3</td>
                    <td>Ikan</td>
                    <td id="doc-ikan">0</td>
                </tr>
                <tr>
                    <th colspan="2" style="text-align: right;">Total Muatan:</th>
                    <th id="doc-total">0 Kg</th>
                </tr>
            </tbody>
        </table>

        <!-- Tombol Aksi Cetak & WhatsApp -->
        <div class="action-buttons">
            <button class="btn-action btn-print" onclick="window.print()">
                🖨️ Cetak / Simpan PDF
            </button>
            <button class="btn-action btn-whatsapp" onclick="shareWhatsApp()">
                💬 Share ke WhatsApp
            </button>
        </div>
    </div>
</div>

<script>
    const daftarPengirim = [
        "OPAN",
        "FAHRUL"
    ];

    const daftarKapal = [
        "KLM.SUMBER RIZKY",
        "KLM.SUMBER RIZKY 02",
        "KLM.SUMBER REZKY A",
        "KLM.ADI RAHMATULLAH PUTRA",
        "KLM.SUMBER REZKY B",
        "KLM.QUDRAT ILAHI",
        "KLM.FIRDAH JAYA 03",
        "KLM.SYUKRAN 3",
        "KLM.SYUKRAN 03",
        "KLM.BUNGA RIZKA",
        "KLM.SURYA UTAMA 77",
        "KLM.MARHABAN 02",
        "KLM.BERKAT SABAR 05",
        "KLM.BERKAH ILAHI 99",
        "KLM.SUMBER REZKY 88",
        "KLM.ANUGERAH REZKY PUTRA"
    ];

    let currentData = {};

    function populateDropdowns() {
        const selectPengirimPerubahan = document.getElementById('pengirim-perubahan');
        const selectPengirimBaru = document.getElementById('pengirim-baru');
        const selectKapalPerubahan = document.getElementById('kapal-perubahan');
        const selectKapalBaru = document.getElementById('kapal-baru');

        daftarPengirim.forEach(pengirim => {
            let opt1 = document.createElement('option');
            opt1.value = pengirim;
            opt1.textContent = pengirim;
            selectPengirimPerubahan.appendChild(opt1);

            let opt2 = document.createElement('option');
            opt2.value = pengirim;
            opt2.textContent = pengirim;
            selectPengirimBaru.appendChild(opt2);
        });

        daftarKapal.forEach(kapal => {
            let option1 = document.createElement('option');
            option1.value = kapal;
            option1.textContent = kapal;
            selectKapalPerubahan.appendChild(option1);

            let option2 = document.createElement('option');
            option2.value = kapal;
            option2.textContent = kapal;
            selectKapalBaru.appendChild(option2);
        });
    }

    function switchTab(tabName) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

        if (tabName === 'perubahan') {
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.getElementById('tab-perubahan').classList.add('active');
        } else {
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            document.getElementById('tab-dokumen-baru').classList.add('active');
        }
        document.getElementById('output-area').style.display = 'none';
    }

    function generateDocument(event, jenisLayanan) {
        event.preventDefault();

        const today = new Date();
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        const formattedDate = today.toLocaleDateString('id-ID', options);

        let pengirim = "", kapal = "", sayur = 0, buah = 0, ikan = 0;

        if (jenisLayanan === 'Perubahan Muatan') {
            pengirim = document.getElementById('pengirim-perubahan').value;
            kapal = document.getElementById('kapal-perubahan').value;
            sayur = parseInt(document.getElementById('sayur-perubahan').value) || 0;
            buah = parseInt(document.getElementById('buah-perubahan').value) || 0;
            ikan = parseInt(document.getElementById('ikan-perubahan').value) || 0;
        } else {
            pengirim = document.getElementById('pengirim-baru').value;
            kapal = document.getElementById('kapal-baru').value;
            sayur = parseInt(document.getElementById('sayur-baru').value) || 0;
            buah = parseInt(document.getElementById('buah-baru').value) || 0;
            ikan = parseInt(document.getElementById('ikan-baru').value) || 0;
        }

        const total = sayur + buah + ikan;

        currentData = {
            pengirim,
            jenisLayanan,
            formattedDate,
            kapal,
            sayur,
            buah,
            ikan,
            total
        };

        document.getElementById('doc-title').textContent = `DOKUMEN ${jenisLayanan.toUpperCase()}`;
        document.getElementById('doc-date').textContent = formattedDate;
        document.getElementById('doc-sender').textContent = pengirim;
        document.getElementById('doc-type').textContent = jenisLayanan;
        document.getElementById('doc-ship').textContent = kapal;
        document.getElementById('doc-sayur').textContent = sayur.toLocaleString('id-ID') + ' Kg';
        document.getElementById('doc-buah').textContent = buah.toLocaleString('id-ID') + ' Kg';
        document.getElementById('doc-ikan').textContent = ikan.toLocaleString('id-ID') + ' Kg';
        document.getElementById('doc-total').textContent = total.toLocaleString('id-ID') + ' Kg';

        const outputArea = document.getElementById('output-area');
        outputArea.style.display = 'block';
        outputArea.scrollIntoView({ behavior: 'smooth' });
    }

    function shareWhatsApp() {
        if (!currentData.kapal) return;

        const textMessage = 
`--- PERMOHONAN ${currentData.jenisLayanan.toUpperCase()} ---
👤 Pengirim: ${currentData.pengirim}
📅 Tanggal: ${currentData.formattedDate}
🚢 Nama Kapal: ${currentData.kapal}

Rincian Muatan:
* Sayuran: ${currentData.sayur.toLocaleString('id-ID')} Kg
* Buah: ${currentData.buah.toLocaleString('id-ID')} Kg
* Ikan: ${currentData.ikan.toLocaleString('id-ID')} Kg
----------------------------------
📦 Total Muatan: ${currentData.total.toLocaleString('id-ID')} Kg

🔗 Link Revisi: https://agas88.web.id/revisi`;

        const encodedText = encodeURIComponent(textMessage);
        window.open(`https://wa.me/?text=${encodedText}`, '_blank');
    }

    window.onload = populateDropdowns;
</script>

</body>
</html>
