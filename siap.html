<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Pencarian Data</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        h2 {
            margin-top: 0;
            color: #2c3e50;
            text-align: center;
            margin-bottom: 20px;
        }

        /* Input Pencarian */
        .search-box {
            width: 100%;
            padding: 12px 16px;
            font-size: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.3s;
            margin-bottom: 20px;
        }

        .search-box:focus {
            border-color: #3498db;
        }

        /* Tabel Data */
        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            text-align: left;
            padding: 12px 15px;
            border-bottom: 1px solid #edf2f7;
        }

        th {
            background-color: #f8fafc;
            color: #475569;
            font-weight: 600;
        }

        tr:hover {
            background-color: #f1f5f9;
        }

        .clickable-name {
            color: #2563eb;
            font-weight: 600;
            cursor: pointer;
            text-decoration: underline;
        }

        .clickable-name:hover {
            color: #1d4ed8;
        }

        .loading, .no-data {
            text-align: center;
            padding: 20px;
            color: #64748b;
        }

        /* Style Modal Pop-up */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: #ffffff;
            width: 90%;
            max-width: 500px;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            position: relative;
            animation: fadeIn 0.2s ease-out;
        }

        @keyframes fadeIn {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 12px;
            margin-bottom: 16px;
        }

        .modal-header h3 {
            margin: 0;
            color: #1e293b;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #64748b;
        }

        .modal-body {
            margin-bottom: 20px;
        }

        .detail-row {
            display: flex;
            margin-bottom: 10px;
            border-bottom: 1px dashed #f1f5f9;
            padding-bottom: 6px;
        }

        .detail-label {
            font-weight: 600;
            width: 40%;
            color: #475569;
        }

        .detail-value {
            width: 60%;
            color: #1e293b;
            word-break: break-word;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .btn {
            padding: 10px 18px;
            border-radius: 6px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            text-align: center;
            font-size: 14px;
        }

        .btn-doc {
            background-color: #2563eb;
            color: #ffffff;
        }

        .btn-doc:hover {
            background-color: #1d4ed8;
        }

        .btn-close {
            background-color: #e2e8f0;
            color: #475569;
        }

        .btn-close:hover {
            background-color: #cbd5e1;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Pencarian Data Google Sheets</h2>
    
    <!-- Input Pencarian -->
    <input type="text" id="searchInput" class="search-box" placeholder="Ketik nama atau kata kunci pencarian (misal: Kamal)..." onkeyup="filterData()">

    <!-- Tabel Data -->
    <div class="table-wrapper">
        <table id="dataTable">
            <thead>
                <tr id="tableHeader">
                    <!-- Header otomatis terisi oleh JavaScript -->
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr>
                    <td colspan="100%" class="loading">Memuat data dari Google Sheets...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Modal Pop-up Rincian -->
<div id="detailModal" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modalTitle">Rincian Data</h3>
            <button class="close-btn" onclick="closeModal()">&times;</button>
        </div>
        <div class="modal-body" id="modalBody">
            <!-- Rincian lengkap otomatis terisi -->
        </div>
        <div class="modal-footer">
            <a id="btnDocument" href="#" target="_blank" class="btn btn-doc" style="display: none;">Lihat File Dokumen</a>
            <button class="btn btn-close" onclick="closeModal()">Tutup</button>
        </div>
    </div>
</div>

<script>
    // Konversi tautan Google Sheets Pubhtml menjadi CSV Ekspor
    const sheetId = "2PACX-1vSe0GgxvkAslstv8Y_hXOzvJWuet_UnOyK7KnAy3c_s8A7IPJotTiQnbcfTNfKenigELFKb1E9gScfq";
    const csvUrl = `https://docs.google.com/spreadsheets/d/e/${sheetId}/pub?gid=0&single=true&output=csv`;

    let globalHeaders = [];
    let globalData = [];

    // Fungsi Fetch Data CSV dari Google Sheets
    async function loadSheetData() {
        try {
            const response = await fetch(csvUrl);
            const csvText = await response.text();
            
            const rows = parseCSV(csvText);
            if (rows.length === 0) {
                document.getElementById('tableBody').innerHTML = '<tr><td colspan="100%" class="no-data">Data kosong.</td></tr>';
                return;
            }

            globalHeaders = rows[0];
            globalData = rows.slice(1);

            renderTable(globalHeaders, globalData);
        } catch (error) {
            console.error('Gagal mengambil data:', error);
            document.getElementById('tableBody').innerHTML = '<tr><td colspan="100%" class="no-data">Gagal memuat data. Pastikan Google Sheet dipublikasikan ke web.</td></tr>';
        }
    }

    // Parser CSV Sederhana (menangani koma & kutip)
    function parseCSV(text) {
        let lines = [];
        let row = [];
        let inQuotes = false;
        let current = '';

        for (let i = 0; i < text.length; i++) {
            let char = text[i];
            let nextChar = text[i + 1];

            if (char === '"' && inQuotes && nextChar === '"') {
                current += '"';
                i++;
            } else if (char === '"') {
                inQuotes = !inQuotes;
            } else if (char === ',' && !inQuotes) {
                row.push(current.trim());
                current = '';
            } else if ((char === '\r' || char === '\n') && !inQuotes) {
                if (char === '\r' && nextChar === '\n') i++;
                row.push(current.trim());
                if (row.some(cell => cell !== '')) lines.push(row);
                row = [];
                current = '';
            } else {
                current += char;
            }
        }
        if (current || row.length > 0) {
            row.push(current.trim());
            if (row.some(cell => cell !== '')) lines.push(row);
        }
        return lines;
    }

    // Tampilkan Data ke Tabel HTML
    function renderTable(headers, data) {
        const headerRow = document.getElementById('tableHeader');
        const bodyRow = document.getElementById('tableBody');

        headerRow.innerHTML = '';
        bodyRow.innerHTML = '';

        // Tampilkan 3-4 kolom pertama saja di tabel utama agar bersih
        const displayHeaders = headers.slice(0, 4);

        displayHeaders.forEach(header => {
            const th = document.createElement('th');
            th.textContent = header;
            headerRow.appendChild(th);
        });

        if (data.length === 0) {
            bodyRow.innerHTML = '<tr><td colspan="100%" class="no-data">Tidak ada data yang cocok.</td></tr>';
            return;
        }

        data.forEach((row, rowIndex) => {
            const tr = document.createElement('tr');
            
            displayHeaders.forEach((_, colIndex) => {
                const td = document.createElement('td');
                const cellValue = row[colIndex] || '-';

                // Kolom pertama/nama dijadikan link yang bisa diklik untuk modal
                if (colIndex === 0 || colIndex === 1) {
                    td.className = 'clickable-name';
                    td.textContent = cellValue;
                    td.onclick = () => showModal(rowIndex);
                } else {
                    td.textContent = cellValue;
                }
                tr.appendChild(td);
            });

            bodyRow.appendChild(tr);
        });
    }

    // Fungsi Filter/Pencarian Data
    function filterData() {
        const keyword = document.getElementById('searchInput').value.toLowerCase();
        const filteredData = globalData.filter(row => {
            return row.some(cell => cell.toLowerCase().includes(keyword));
        });
        renderTable(globalHeaders, filteredData);
    }

    // Fungsi Tampilkan Modal Rincian
    function showModal(rowIndex) {
        const rowData = globalData[rowIndex];
        const modalBody = document.getElementById('modalBody');
        const btnDocument = document.getElementById('btnDocument');
        
        modalBody.innerHTML = '';
        btnDocument.style.display = 'none';

        // Tampilkan semua kolom di dalam modal
        globalHeaders.forEach((header, index) => {
            const val = rowData[index] || '-';

            // Cek apakah data berisi URL file/dokumen (http/https atau Drive link)
            if (val.startsWith('http://') || val.startsWith('https://')) {
                btnDocument.href = val;
                btnDocument.style.display = 'inline-block';
            }

            const detailRow = document.createElement('div');
            detailRow.className = 'detail-row';
            detailRow.innerHTML = `
                <div class="detail-label">${header}</div>
                <div class="detail-value">${val.startsWith('http') ? `<a href="${val}" target="_blank">Buka Tautan</a>` : val}</div>
            `;
            modalBody.appendChild(detailRow);
        });

        document.getElementById('detailModal').style.display = 'flex';
    }

    // Fungsi Tutup Modal
    function closeModal() {
        document.getElementById('detailModal').style.display = 'none';
    }

    // Tutup modal jika klik di luar area modal
    window.onclick = function(event) {
        const modal = document.getElementById('detailModal');
        if (event.target === modal) {
            closeModal();
        }
    };

    // Jalankan aplikasi saat halaman dimuat
    loadSheetData();
</script>

</body>
</html>
