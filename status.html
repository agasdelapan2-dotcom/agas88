<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status Keberangkatan Kapal</title>
    <!-- Favicon & App Icon untuk Google Search & Browser -->
    <link rel="icon" type="image/png" href="https://res.cloudinary.com/di8stbg60/image/upload/v1779535052/logo_fft6zk.png">
    <link rel="shortcut icon" type="image/x-icon" href="https://res.cloudinary.com/di8stbg60/image/upload/v1779535052/logo_fft6zk.png">
    <link rel="apple-touch-icon" href="https://res.cloudinary.com/di8stbg60/image/upload/v1779535052/logo_fft6zk.png">
     <link rel="icon" href="https://res.cloudinary.com/di8stbg60/image/upload/v1779535052/logo_fft6zk.png" type="image/png" sizes="48x48">
     <link rel="icon" href="https://res.cloudinary.com/di8stbg60/image/upload/v1779535052/logo_fft6zk.png" type="image/png" sizes="192x192">
     <link rel="shortcut icon" href="https://res.cloudinary.com/di8stbg60/image/upload/v1779535052/logo_fft6zk.png" type="image/x-icon">
     <link rel="apple-touch-icon" href="https://res.cloudinary.com/di8stbg60/image/upload/v1779535052/logo_fft6zk.png">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            padding: 10px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            background: #ffffff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        /* Banner Total Trayek */
        .total-banner {
            background-color: #0d47a1;
            color: #ffffff;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            padding: 12px 20px;
            border-radius: 6px;
            margin-bottom: 15px;
            letter-spacing: 0.5px;
            box-shadow: 0 2px 6px rgba(13, 71, 161, 0.25);
        }

        #loading {
            text-align: center;
            font-weight: bold;
            padding: 15px;
            color: #555;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th, td {
            border: 1px solid #dcdcdc;
            padding: 8px 6px;
            vertical-align: middle;
        }

        th {
            background-color: #d9e1f2;
            font-weight: bold;
            text-align: center;
        }

        .text-center { text-align: center; }

        .ship-name-link {
            color: #0d47a1;
            font-weight: bold;
            cursor: pointer;
            text-decoration: underline;
        }

        .ship-name-link:hover {
            color: #1976d2;
        }

        .check-input {
            width: 22px;
            height: 22px;
            cursor: pointer;
            accent-color: #2196F3;
        }

        /* Style Badge Status */
        .status-cell {
            font-weight: bold;
            text-align: center;
            border-radius: 4px;
            padding: 4px 10px;
            display: inline-block;
        }

        .status-sudah {
            background-color: #c6efce;
            color: #006100;
        }

        .status-belum {
            background-color: #ff0000;
            color: #ffffff;
        }

        /* Style Badge Trayek */
        .trayek-badge {
            background-color: #e3f2fd;
            color: #0d47a1;
            font-weight: bold;
            font-size: 13px;
            padding: 4px 12px;
            border-radius: 4px;
            border: 1px solid #90caf9;
            display: inline-block;
            text-align: center;
            min-width: 30px;
        }

        /* Styling Thumbnail Foto Tabel */
        .img-thumb {
            width: 50px;
            height: 40px;
            object-fit: cover;
            border-radius: 4px;
            cursor: pointer;
            border: 1px solid #ccc;
            transition: transform 0.2s;
        }

        .img-thumb:hover {
            transform: scale(1.1);
        }

        /* ====================================================== */
        /* MODAL RINCIAN PROFESIONAL */
        /* ====================================================== */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .modal-card {
            background: #ffffff;
            width: 100%;
            max-width: 480px;
            border-radius: 12px;
            padding: 20px 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2);
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 12px;
            margin-bottom: 12px;
        }

        .modal-card h3 {
            color: #0f172a;
            font-size: 18px;
            font-weight: 700;
        }

        .close-btn {
            font-size: 22px;
            font-weight: bold;
            color: #94a3b8;
            cursor: pointer;
            transition: color 0.2s;
            line-height: 1;
        }

        .close-btn:hover {
            color: #0f172a;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #f1f5f9;
            font-size: 14px;
        }

        .detail-row label {
            font-weight: 600;
            color: #475569;
        }

        .detail-val {
            font-weight: 500;
            color: #1e293b;
        }

        .check-text-true {
            color: #15803d;
            font-weight: 600;
        }

        .check-text-false {
            color: #64748b;
        }

        /* Galeri Foto Modal */
        .modal-photos {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 18px;
        }

        .photo-box {
            text-align: center;
            background: #f8fafc;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }

        .photo-box img {
            width: 100%;
            height: 100px;
            object-fit: cover;
            border-radius: 6px;
            cursor: pointer;
            border: 1px solid #cbd5e1;
            transition: opacity 0.2s;
        }

        .photo-box img:hover {
            opacity: 0.9;
        }

        .photo-box span {
            font-size: 12px;
            font-weight: 600;
            color: #64748b;
            display: block;
            margin-top: 6px;
        }

        /* Modal Pembesaran Foto Penuh */
        .modal-img-full {
            max-width: 90%;
            max-height: 80%;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        /* TAMPILAN RESPONSIVE HP */
        @media screen and (max-width: 768px) {
            body { padding: 5px; }
            .container { padding: 10px; }

            .total-banner {
                font-size: 16px;
                padding: 10px 15px;
            }

            table, thead, tbody, th, td, tr { display: block; }

            thead tr {
                position: absolute;
                top: -9999px;
                left: -9999px;
            }

            tr {
                background: #ffffff;
                border: 1px solid #e0e0e0;
                border-radius: 8px;
                margin-bottom: 12px;
                padding: 12px;
                box-shadow: 0 1px 4px rgba(0,0,0,0.05);
            }

            td {
                border: none;
                padding: 6px 0;
                display: flex;
                justify-content: space-between;
                align-items: center;
                font-size: 14px;
            }

            td:nth-child(2) {
                border-bottom: 1px solid #f0f0f0;
                padding-bottom: 8px;
                margin-bottom: 6px;
            }

            td:nth-child(1)::before { content: "No:"; font-weight: bold; color: #666; }
            td:nth-child(2)::before { content: "Nama Kapal:"; font-weight: bold; color: #666; }
            td:nth-child(3)::before { content: "Minggu I Oktober:"; font-weight: bold; color: #444; }
            td:nth-child(4)::before { content: "Minggu II Oktober:"; font-weight: bold; color: #444; }
            td:nth-child(5)::before { content: "Minggu III Oktober:"; font-weight: bold; color: #444; }
            td:nth-child(6)::before { content: "Minggu IV Oktober:"; font-weight: bold; color: #444; }
            td:nth-child(7)::before { content: "Status:"; font-weight: bold; color: #444; }
            td:nth-child(8)::before { content: "Trayek:"; font-weight: bold; color: #444; }
            td:nth-child(9)::before { content: "Foto 1:"; font-weight: bold; color: #444; }
            td:nth-child(10)::before { content: "Foto 2:"; font-weight: bold; color: #444; }
            td:nth-child(11)::before { content: "Foto 3:"; font-weight: bold; color: #444; }
            td:nth-child(12)::before { content: "Foto 4:"; font-weight: bold; color: #444; }

            .img-thumb {
                width: 65px;
                height: 45px;
            }
        }
      .float-home-neon {
  position: fixed;
  bottom: 25px;

  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 20px;
  background: rgba(15, 23, 42, 0.75);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.18);
  border-radius: 50px;
  color: #fff;
  text-decoration: none;
  font-family: 'Poppins', sans-serif;
  font-weight: 600;

  letter-spacing: 1px;
  box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);

.float-home-neon .home-icon {

  transform: translateY(-5px) scale(1.05);

  border-color: #00f2fe;

  color: #00f2fe;

.float-home-neon:hover .home-icon {

<body>

<div class="container">
    <div id="total-banner" class="total-banner">TOTAL TRAYEK = 0</div>

    <div id="loading">Memuat data dari Google Sheets...</div>
    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th style="width: 35px;">No</th>
                    <th>Nama Kapal</th>
                    <th style="width: 100px;">Minggu I Oktober</th>
                    <th style="width: 100px;">Minggu II Oktober</th>
                    <th style="width: 100px;">Minggu III Oktober</th>
                    <th style="width: 100px;">Minggu IV Oktober</th>
                    <th style="width: 80px;">Status</th>
                    <th style="width: 60px;">Trayek</th>
                    <th style="width: 65px;">Foto 1</th>
                    <th style="width: 65px;">Foto 2</th>
                    <th style="width: 65px;">Foto 3</th>
                    <th style="width: 65px;">Foto 4</th>
                </tr>
            </thead>
            <tbody id="table-body">
                <!-- Data diisi otomatis via JS -->
            </tbody>
        </table>
    </div>
</div>

<!-- Modal Rincian Kapal Profesional -->
<div id="detailModal" class="modal">
    <div class="modal-card">
        <div class="modal-header">
            <h3 id="modalShipName">Nama Kapal</h3>
            <span class="close-btn" onclick="closeDetailModal()">&times;</span>
        </div>
        
        <div class="detail-row"><label>No:</label><span id="modalNo" class="detail-val">-</span></div>
        <div class="detail-row"><label>Minggu I Oktober:</label><span id="modalM1" class="detail-val">-</span></div>
        <div class="detail-row"><label>Minggu II Oktober:</label><span id="modalM2" class="detail-val">-</span></div>
        <div class="detail-row"><label>Minggu III Oktober:</label><span id="modalM3" class="detail-val">-</span></div>
        <div class="detail-row"><label>Minggu IV Oktober:</label><span id="modalM4" class="detail-val">-</span></div>
        <div class="detail-row"><label>Status:</label><span id="modalStatus">-</span></div>
        <div class="detail-row"><label>Trayek:</label><span id="modalTrayek">-</span></div>

        <div class="modal-photos">
            <div class="photo-box">
                <img id="modalFoto1" src="https://res.cloudinary.com/di8stbg60/image/upload/v1791516933/no-foto_gjyfqw.png" alt="Foto 1" onclick="openFullImage(this.src)">
                <span>Foto 1</span>
            </div>
            <div class="photo-box">
                <img id="modalFoto2" src="https://res.cloudinary.com/di8stbg60/image/upload/v1791516933/no-foto_gjyfqw.png" alt="Foto 2" onclick="openFullImage(this.src)">
                <span>Foto 2</span>
            </div>
            <div class="photo-box">
                <img id="modalFoto3" src="https://res.cloudinary.com/di8stbg60/image/upload/v1791516933/no-foto_gjyfqw.png" alt="Foto 3" onclick="openFullImage(this.src)">
                <span>Foto 3</span>
            </div>
            <div class="photo-box">
                <img id="modalFoto4" src="https://res.cloudinary.com/di8stbg60/image/upload/v1791516933/no-foto_gjyfqw.png" alt="Foto 4" onclick="openFullImage(this.src)">
                <span>Foto 4</span>
            </div>
        </div>
    </div>
</div>

<!-- Modal Pembesaran Foto Penuh -->
<div id="imageModal" class="modal" onclick="closeFullImage()">
    <span class="close-btn" style="color:white; position:absolute; top:20px; right:25px;">&times;</span>
    <img class="modal-img-full" id="imgFull">
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwA99h69pzJZIrZLSV9KVxuwgno5qmxi4cMBMEwDAiM10nd4Qrjf3nYJziU8YxUpxJzBw/exec";
    let globalData = [];

    function calculateTotalTrayek() {
        const trayekCells = document.querySelectorAll('.trayek-cell');
        let grandTotal = 0;
        trayekCells.forEach(cell => {
            grandTotal += parseInt(cell.textContent) || 0;
        });
        document.getElementById('total-banner').textContent = `TOTAL TRAYEK = ${grandTotal}`;
    }

    async function fetchSheetsData() {
        try {
            const response = await fetch(SCRIPT_URL);
            globalData = await response.json();
            
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            globalData.forEach((row, index) => {
                const id = row[0];
                const nama = row[1];
                const m1 = row[2] === true || row[2] === "TRUE";
                const m2 = row[3] === true || row[3] === "TRUE";
                const m3 = row[4] === true || row[4] === "TRUE";
                const m4 = row[5] === true || row[5] === "TRUE";
                
                const foto1 = row[8] || "https://res.cloudinary.com/di8stbg60/image/upload/v1791516933/no-foto_gjyfqw.png";
                const foto2 = row[9] || "https://res.cloudinary.com/di8stbg60/image/upload/v1791516933/no-foto_gjyfqw.png";
                const foto3 = row[10] || "https://res.cloudinary.com/di8stbg60/image/upload/v1791516933/no-foto_gjyfqw.png";
                const foto4 = row[11] || "https://res.cloudinary.com/di8stbg60/image/upload/v1791516933/no-foto_gjyfqw.png";
                
                const checkedCount = (m1?1:0) + (m2?1:0) + (m3?1:0) + (m4?1:0);
                const statusText = checkedCount > 0 ? 'sudah' : 'belum';
                const statusClass = checkedCount > 0 ? 'status-sudah' : 'status-belum';

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="text-center">${id}</td>
                    <td><span class="ship-name-link" onclick="showDetailModal(${index})">${nama}</span></td>
                    <td class="text-center"><input type="checkbox" class="check-input" ${m1 ? 'checked' : ''} onchange="updateData(${id}, this, ${index})"></td>
                    <td class="text-center"><input type="checkbox" class="check-input" ${m2 ? 'checked' : ''} onchange="updateData(${id}, this, ${index})"></td>
                    <td class="text-center"><input type="checkbox" class="check-input" ${m3 ? 'checked' : ''} onchange="updateData(${id}, this, ${index})"></td>
                    <td class="text-center"><input type="checkbox" class="check-input" ${m4 ? 'checked' : ''} onchange="updateData(${id}, this, ${index})"></td>
                    <td><span class="status-cell ${statusClass}">${statusText}</span></td>
                    <td class="text-center"><span class="trayek-badge trayek-cell">${checkedCount}</span></td>
                    <td class="text-center"><img src="${foto1}" class="img-thumb" alt="Foto 1" onclick="openFullImage('${foto1}')"></td>
                    <td class="text-center"><img src="${foto2}" class="img-thumb" alt="Foto 2" onclick="openFullImage('${foto2}')"></td>
                    <td class="text-center"><img src="${foto3}" class="img-thumb" alt="Foto 3" onclick="openFullImage('${foto3}')"></td>
                    <td class="text-center"><img src="${foto4}" class="img-thumb" alt="Foto 4" onclick="openFullImage('${foto4}')"></td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('loading').style.display = 'none';
            calculateTotalTrayek();
        } catch (error) {
            console.error('Gagal mengambil data:', error);
            document.getElementById('loading').innerText = 'Gagal memuat data.';
        }
    }

    async function updateData(id, inputElement, index) {
        const tr = inputElement.closest('tr');
        const checkboxes = tr.querySelectorAll('.check-input');

        const m1 = checkboxes[0].checked;
        const m2 = checkboxes[1].checked;
        const m3 = checkboxes[2].checked;
        const m4 = checkboxes[3].checked;

        globalData[index][2] = m1;
        globalData[index][3] = m2;
        globalData[index][4] = m3;
        globalData[index][5] = m4;

        const checkedCount = (m1?1:0) + (m2?1:0) + (m3?1:0) + (m4?1:0);
        
        const statusCell = tr.querySelector('.status-cell');
        const trayekCell = tr.querySelector('.trayek-cell');

        trayekCell.textContent = checkedCount;
        if (checkedCount > 0) {
            statusCell.textContent = 'sudah';
            statusCell.className = 'status-cell status-sudah';
        } else {
            statusCell.textContent = 'belum';
            statusCell.className = 'status-cell status-belum';
        }

        calculateTotalTrayek();

        await fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id, m1, m2, m3, m4 })
        });
    }

    // Modal Rincian Kapal
    function showDetailModal(index) {
        const row = globalData[index];
        const m1 = row[2] === true || row[2] === "TRUE";
        const m2 = row[3] === true || row[3] === "TRUE";
        const m3 = row[4] === true || row[4] === "TRUE";
        const m4 = row[5] === true || row[5] === "TRUE";
        const checkedCount = (m1?1:0) + (m2?1:0) + (m3?1:0) + (m4?1:0);

        document.getElementById('modalNo').textContent = row[0];
        document.getElementById('modalShipName').textContent = row[1];
        
        // Memperbaiki tampilan centang agar profesional tanpa kode HTML entity yang rusak
        document.getElementById('modalM1').innerHTML = m1 ? '<span class="check-text-true">☑ Tercentang</span>' : '<span class="check-text-false">☐ Belum</span>';
        document.getElementById('modalM2').innerHTML = m2 ? '<span class="check-text-true">☑ Tercentang</span>' : '<span class="check-text-false">☐ Belum</span>';
        document.getElementById('modalM3').innerHTML = m3 ? '<span class="check-text-true">☑ Tercentang</span>' : '<span class="check-text-false">☐ Belum</span>';
        document.getElementById('modalM4').innerHTML = m4 ? '<span class="check-text-true">☑ Tercentang</span>' : '<span class="check-text-false">☐ Belum</span>';
        
        const statusSpan = document.getElementById('modalStatus');
        statusSpan.textContent = checkedCount > 0 ? 'sudah' : 'belum';
        statusSpan.className = checkedCount > 0 ? 'status-cell status-sudah' : 'status-cell status-belum';
        
        document.getElementById('modalTrayek').innerHTML = `<span class="trayek-badge">${checkedCount}</span>`;

        document.getElementById('modalFoto1').src = row[8] || "https://via.placeholder.com/150?text=No+Img";
        document.getElementById('modalFoto2').src = row[9] || "https://via.placeholder.com/150?text=No+Img";
        document.getElementById('modalFoto3').src = row[10] || "https://via.placeholder.com/150?text=No+Img";
        document.getElementById('modalFoto4').src = row[11] || "https://via.placeholder.com/150?text=No+Img";

        document.getElementById('detailModal').style.display = 'flex';
    }

    function closeDetailModal() {
        document.getElementById('detailModal').style.display = 'none';
    }

    function openFullImage(url) {
        document.getElementById('imgFull').src = url;
        document.getElementById('imageModal').style.display = 'flex';
    }

    function closeFullImage() {
        document.getElementById('imageModal').style.display = 'none';
    }

    fetchSheetsData();
