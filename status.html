<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status Keberangkatan Kapal</title>
    <!-- Favicon & App Icon untuk Google Search & Browser -->
    <link rel="icon" type="image/png" href="https://res.cloudinary.com/di8stbg60/image/upload/v1779535052/logo_fft6zk.png">
    <link rel="shortcut icon" type="image/x-icon" href="https://res.cloudinary.com/di8stbg60/image/upload/v1779535052/logo_fft6zk.png">
    <link rel="apple-touch-icon" href="https://res.cloudinary.com/di8stbg60/image/upload/v1779535052/logo_fft6zk.png">
     <link rel="icon" href="https://res.cloudinary.com/di8stbg60/image/upload/v1779535052/logo_fft6zk.png" type="image/png" sizes="48x48">
     <link rel="icon" href="https://res.cloudinary.com/di8stbg60/image/upload/v1779535052/logo_fft6zk.png" type="image/png" sizes="192x192">
     <link rel="shortcut icon" href="https://res.cloudinary.com/di8stbg60/image/upload/v1779535052/logo_fft6zk.png" type="image/x-icon">
     <link rel="apple-touch-icon" href="https://res.cloudinary.com/di8stbg60/image/upload/v1779535052/logo_fft6zk.png">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background-color: #f5f5f5;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            background: #ffffff;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 13px;
        }

        th, td {
            border: 1px solid #000000;
            padding: 6px 10px;
        }

        th {
            background-color: #d9e1f2;
            font-weight: bold;
            text-align: center;
        }

        .text-center {
            text-align: center;
        }

        .check-input {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: #555555;
        }

        .status-cell {
            font-weight: bold;
            text-align: center;
        }

        .status-sudah {
            background-color: #c6efce;
            color: #006100;
        }

        .status-belum {
            background-color: #ff0000;
            color: #ffffff;
        }

        #loading {
            text-align: center;
            font-weight: bold;
            padding: 10px;
            color: #555;
        }
      .float-home-neon {
  position: fixed;
  bottom: 25px;
  right: 25px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 20px;
  background: rgba(15, 23, 42, 0.75);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.18);
  border-radius: 50px;
  color: #fff;
  text-decoration: none;
  font-family: 'Poppins', sans-serif;
  font-weight: 600;
  font-size: 14px;
  letter-spacing: 1px;
  box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
  z-index: 9999;
  transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.float-home-neon .home-icon {
  width: 20px;
  height: 20px;
  fill: #00f2fe;
  transition: transform 0.3s ease;
}

.float-home-neon:hover {
  transform: translateY(-5px) scale(1.05);
  background: rgba(15, 23, 42, 0.9);
  border-color: #00f2fe;
  box-shadow: 0 0 20px rgba(0, 242, 254, 0.6);
  color: #00f2fe;
}

.float-home-neon:hover .home-icon {
  transform: scale(1.2);
  fill: #00f2fe;
}
    </style>
</head>
<body>

<div class="container">
    <div id="loading">Memuat data dari Google Sheets...</div>
    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th style="width: 40px;">No</th>
                    <th>Nama Kapal</th>
                    <th style="width: 80px;">Minggu 1</th>
                    <th style="width: 80px;">Minggu 2</th>
                    <th style="width: 80px;">Minggu 3</th>
                    <th style="width: 80px;">Minggu 4</th>
                    <th style="width: 90px;">Status</th>
                    <th style="width: 70px;">Trayek</th>
                </tr>
            </thead>
            <tbody id="table-body">
                <!-- Data akan diisi otomatis dari Google Sheets -->
            </tbody>
        </table>
    </div>
</div>

<script>
    // GANTI DENGAN URL WEB APP GOOGLE APPS SCRIPT ANDA
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzz9zvxSeuduYJDApQ98tqP9aVrHeh91mC8D2VQFc9dT6b_0Op3VbolVI-KMDO74E2XhA/exec";

    // 1. Ambil data dari Google Sheets
    async function fetchSheetsData() {
        try {
            const response = await fetch(SCRIPT_URL);
            const data = await response.json();
            
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            data.forEach(row => {
                const id = row[0];
                const nama = row[1];
                const m1 = row[2] === true || row[2] === "TRUE";
                const m2 = row[3] === true || row[3] === "TRUE";
                const m3 = row[4] === true || row[4] === "TRUE";
                const m4 = row[5] === true || row[5] === "TRUE";
                
                const checkedCount = (m1?1:0) + (m2?1:0) + (m3?1:0) + (m4?1:0);
                const statusText = checkedCount > 0 ? 'sudah' : 'belum';
                const statusClass = checkedCount > 0 ? 'status-sudah' : 'status-belum';

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="text-center">${id}</td>
                    <td>${nama}</td>
                    <td class="text-center"><input type="checkbox" class="check-input" ${m1 ? 'checked' : ''} onchange="updateData(${id}, this)"></td>
                    <td class="text-center"><input type="checkbox" class="check-input" ${m2 ? 'checked' : ''} onchange="updateData(${id}, this)"></td>
                    <td class="text-center"><input type="checkbox" class="check-input" ${m3 ? 'checked' : ''} onchange="updateData(${id}, this)"></td>
                    <td class="text-center"><input type="checkbox" class="check-input" ${m4 ? 'checked' : ''} onchange="updateData(${id}, this)"></td>
                    <td class="status-cell ${statusClass}">${statusText}</td>
                    <td class="text-center trayek-cell">${checkedCount}</td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('loading').style.display = 'none';
        } catch (error) {
            console.error('Gagal mengambil data:', error);
            document.getElementById('loading').innerText = 'Gagal memuat data.';
        }
    }

    // 2. Simpan Perubahan ke Google Sheets
    async function updateData(id, inputElement) {
        const tr = inputElement.closest('tr');
        const checkboxes = tr.querySelectorAll('.check-input');

        const m1 = checkboxes[0].checked;
        const m2 = checkboxes[1].checked;
        const m3 = checkboxes[2].checked;
        const m4 = checkboxes[3].checked;

        const checkedCount = (m1?1:0) + (m2?1:0) + (m3?1:0) + (m4?1:0);
        
        // Update tampilan secara instan
        const statusCell = tr.querySelector('.status-cell');
        const trayekCell = tr.querySelector('.trayek-cell');

        trayekCell.textContent = checkedCount;
        if (checkedCount > 0) {
            statusCell.textContent = 'sudah';
            statusCell.className = 'status-cell status-sudah';
        } else {
            statusCell.textContent = 'belum';
            statusCell.className = 'status-cell status-belum';
        }

        // Kirim perubahan ke Google Sheets secara permanen
        await fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id, m1, m2, m3, m4 })
        });
    }

    // Jalankan saat pertama kali dibuka
    fetchSheetsData();
</script>
<!-- Tombol Melayang Neon/Glassmorphism -->
<a href="https://agas88.com/" class="float-home-neon" title="Kembali ke Home">

</body>
</html>
